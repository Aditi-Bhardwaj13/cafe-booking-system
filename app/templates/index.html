{% extends 'base.html' %}

{% block title %}Cafe Booking{% endblock %}

{% block content %}
  <section class="hero">
    <h1>Reserve your table</h1>
    <p>Book a table for breakfast, lunch, coffee meetings, or evening dining.</p>
    {% if current_user.is_authenticated %}
      <a class="button" href="{{ url_for('main.booking') }}">Book a table</a>
    {% else %}
      <a class="button" href="{{ url_for('auth.register') }}">Create account</a>
      <a class="button secondary" href="{{ url_for('auth.login') }}">Log in</a>
    {% endif %}
  </section>
{% endblock %}
